name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# Cancel the previous runs of the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make lint

  test-unit:
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - uses: actions/checkout@v6
      - run: make test-unit

  # Real WireGuard connections between containers (the runner kernel has the WireGuard module)
  test-integration:
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats
      - run: make test-integration
